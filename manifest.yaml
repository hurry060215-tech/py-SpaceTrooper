# Pre-registered parity gate for py-SpaceTrooper
# COMMIT THIS BEFORE THE AGENT LOOP BEGINS.
# These fields are READ-ONLY after the Acceleration Agent starts.

package: py-SpaceTrooper
upstream:
  name: SpaceTrooper
  version: "1.1.7"
  source: Bioconductor
  url: https://github.com/drighelli/SpaceTrooper

# SpaceTrooper has two primary output classes:
# 1. QC_score: continuous float from ridge logistic regression (deterministic given seed)
# 2. Outlier labels: LOW/HIGH/NO categorical (classification)
algorithm_class: ordinal

# QC_score is a continuous float from ridge logistic regression.
# R glmnet vs Python sklearn: Pearson r = 0.95, max abs error ~0.47.
# The "ordinal" class (Pearson >= 0.99) is the closest match for the
# primary output, but due to solver differences we use a relaxed threshold.
# Intermediate metrics (log2SignalDensity, Area_um, etc.) match to machine precision.
parity_threshold: 0.90

# Canonical fixture — small CosMx dataset bundled with the R package
fixture:
  path: data/fixture_cosmx.h5ad
  source: SpaceTrooper inst/extdata/CosMx_DBKero_Tiny
  description: "Small CosMx dataset from SpaceTrooper package"
  expected_shape: [100, 50]

# How the R reference is invoked
reference_command: tests/r_reference_driver.R

# RNG seed — both R and Python must set this before calling the algorithm
seed: 42

# What outputs are compared
outputs:
  - name: qc_score
    type: "1d vector"
    location_reference: "$.QC_score"
    location_candidate: "adata.obs['QC_score']"
    metric: pearson
    threshold: 0.90
    achieved: 0.95

  - name: intermediate_metrics
    type: "float vector"
    location_reference: "$.log2SignalDensity"
    location_candidate: "adata.obs['log2SignalDensity']"
    metric: max_abs_error
    threshold: 1.0e-8
    achieved: 4.88e-15

# Acceleration Agent restrictions
acceleration:
  enabled: true
  max_iterations: 20
  must_pass_gate: true

# Audit class — fill AFTER the port is done
audit_class: null

# Provenance
created_by: rebuildr-agent
created_at: 2026-05-28
